<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ site_name }}{% endblock %}</title>
  <meta name="description" content="Full-text search over every Python Enhancement Proposal.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
  <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
</head>
<body>
  <header class="masthead">
    <a class="brand" href="/">find<span>ex</span></a>
    {% block searchbar %}{% endblock %}
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer class="colophon">
    <p>findex {{ version }} — a search engine built from scratch in a Python course: tokenizer, inverted index, BM25, FastAPI.
      <a href="/docs">API</a> · <a href="https://github.com/dfsgotl-lenya/findex">Source</a></p>
    <p>Corpus: the <a href="https://github.com/python/peps">python/peps</a> repository (public domain / CC0).</p>
  </footer>
</body>
</html>

<form class="search" action="/" method="get" role="search"
      hx-get="/ui/results" hx-target="#results" hx-push-url="true"
      hx-trigger="submit, input changed delay:300ms from:#q, change from:.options input">
  <label class="visually-hidden" for="q">Search PEPs</label>
  <input id="q" name="q" type="search" value="{{ q }}" maxlength="200"
         placeholder="walrus operator, &quot;pattern matching&quot;, async NOT generator"
         autocomplete="off" autofocus>
  <div class="options">
    {% if semantic_available %}
    <fieldset class="modes">
      <legend class="visually-hidden">Search mode</legend>
      <label><input type="radio" name="mode" value="keyword" {% if mode == 'keyword' %}checked{% endif %}> Words</label>
      <label><input type="radio" name="mode" value="semantic" {% if mode == 'semantic' %}checked{% endif %}> Meaning</label>
      <label><input type="radio" name="mode" value="hybrid" {% if mode == 'hybrid' %}checked{% endif %}> Both</label>
    </fieldset>
    {% endif %}
    <fieldset class="scorer">
      <legend class="visually-hidden">Keyword ranking</legend>
      <label><input type="radio" name="scorer" value="bm25" {% if scorer == 'bm25' %}checked{% endif %}> BM25</label>
      <label><input type="radio" name="scorer" value="tfidf" {% if scorer == 'tfidf' %}checked{% endif %}> TF-IDF</label>
    </fieldset>
  </div>
  <button type="submit">Search</button>
</form>
